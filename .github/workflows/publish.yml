# Publishes @umage.ai/redline to npm through Trusted Publishing (OIDC): no npm token is stored anywhere.
# npm side: package settings → Trusted Publisher → GitHub Actions, repo umage-ai/redline, workflow publish.yml.
#
# Release: `npm run release -- patch|minor|major` on main (scripts/release.mjs) bumps the version and pushes a
# v<version> tag. The tag runs this workflow: checks, npm publish, then a GitHub release with generated notes.
# Try the pipeline without publishing: Actions → Publish to npm → Run workflow (dry run is the default).
name: Publish to npm

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and `npm publish --dry-run`, without publishing
        type: boolean
        default: true

permissions:
  contents: write   # create the GitHub release after publishing
  id-token: write   # the OIDC token npm exchanges for a one-off publish credential

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PW_CHROMIUM: '1'   # Playwright's bundled Chromium instead of an installed Chrome
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # to check the tag is on main

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: npm with Trusted Publishing support (11.5.1+)
        run: npm install -g npm@^11.5.1

      - name: Tag matches package.json and is on main
        if: github.event_name == 'push'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1
          fi

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Typecheck, unit, docs, e2e
        run: npm run check

      - name: Packed tarball in fresh React / SvelteKit / Astro / node apps
        run: npm run test:package

      # Scripts already ran above (and built dist/), so skip prepublishOnly's second pass.
      - name: Publish
        if: github.event_name == 'push' || !inputs.dry_run
        run: npm publish --ignore-scripts

      - name: GitHub release with generated notes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

      # npm refuses even a dry run for a version that is already published, so between releases show the tarball instead.
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "::notice::$spec is already on npm. Bump the version before releasing; showing the tarball instead."
            npm pack --dry-run --ignore-scripts
          else
            npm publish --ignore-scripts --dry-run
          fi

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
